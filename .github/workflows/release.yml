name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only, do not publish'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish @glebmish/limn
    permissions:
      contents: write        # GitHub Release
      id-token: write        # npm provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: this job holds id-token and NPM_TOKEN, so it never restores a
      # cache another job could have written.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG != package.json version $PKG"; exit 1; }
      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk -v h="## ${GITHUB_REF_NAME#v}" '$0==h{f=1;next} /^## /&&f{exit} f' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md" || { echo "::error::no CHANGELOG section for ${GITHUB_REF_NAME}"; exit 1; }
      - name: Install dependencies
        run: npm ci
      - name: Build + pack smoke
        run: npm run pack:smoke
      # `npm pack` below bundles whatever is on disk in node_modules for the
      # bundleDependencies packages at pack time, and pack:smoke deliberately
      # RESTORES a full tree in its exit trap (so a local run leaves vite/vitest
      # working). So the strip has to happen here, after it. rollup's own optional
      # native binary isn't needed any more — the build already ran inside
      # pack:smoke. `npm publish` further down re-runs the prepack guard against
      # this stripped tree.
      - name: Strip optional platform binaries before packing
        run: npm ci --omit=optional
      - name: Assert the tree carries no platform binaries
        run: scripts/assert-no-platform-binaries.sh
      - name: Pack
        run: npm pack --ignore-scripts
      - name: Assert tarball has no platform binaries
        run: |
          listing="$(tar -tzf *.tgz)"
          if grep -E 'claude-agent-sdk-(darwin|linux|win32)|codex-(darwin|linux|win32)' <<<"$listing"; then
            echo "::error::platform binaries in tarball"
            exit 1
          fi
      # Runs on dry runs too, so a dispatch proves the token before a tag relies on it.
      - name: Check npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Upload tarball (inspection / dry-run)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: limn-npm-tarball
          path: '*.tgz'
      # NPM_TOKEN: npm granular access token (read+write, bypass 2FA; "All packages" until
      # the first publish exists, then narrow to @glebmish/limn). Max 90-day expiry: rotate.
      # Publishing the checked tarball (not a re-pack) keeps npm, the asserts and the
      # GitHub Release asset byte-identical.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        run: npm publish ./*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: '*.tgz'
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
