name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only, do not publish'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write          # npm provenance

jobs:
  publish:
    name: Publish @glebmish/limn
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG != package.json version $PKG"; exit 1; }
      - name: Build + pack smoke
        run: npm run pack:smoke
      # `npm pack` below bundles whatever is on disk in node_modules for the
      # bundleDependencies packages at pack time, and pack:smoke deliberately
      # RESTORES a full tree in its exit trap (so a local run leaves vite/vitest
      # working). So the strip has to happen here, after it. rollup's own optional
      # native binary isn't needed any more — the build already ran inside
      # pack:smoke. `npm publish` further down re-runs the prepack guard against
      # this stripped tree.
      - name: Strip optional platform binaries before packing
        run: npm ci --omit=optional
      - name: Assert the tree carries no platform binaries
        run: scripts/assert-no-platform-binaries.sh
      - name: Pack
        run: npm pack --ignore-scripts
      - name: Assert tarball has no platform binaries
        run: |
          listing="$(tar -tzf *.tgz)"
          if grep -E 'claude-agent-sdk-(darwin|linux|win32)|codex-(darwin|linux|win32)' <<<"$listing"; then
            echo "::error::platform binaries in tarball"
            exit 1
          fi
      - name: Upload tarball (inspection / dry-run)
        uses: actions/upload-artifact@v7
        with:
          name: limn-npm-tarball
          path: '*.tgz'
      # NPM_TOKEN: an npm automation token for @glebmish; with npm trusted publishing
      # configured for this repo the env line can be dropped.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        uses: softprops/action-gh-release@v3
        with:
          files: '*.tgz'
          generate_release_notes: true
          fail_on_unmatched_files: true
