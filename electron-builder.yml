appId: dev.glebmish.limn
productName: Limn
directories:
  output: dist
  buildResources: build
electronLanguages:
  - en
files:
  - out/**
  - package.json
  - "!node_modules/electron/**"
  # ACP adapters (@agentclientprotocol/*) + their JS SDK glue are bundled; the
  # engines' NATIVE binaries are NOT. The user supplies claude / codex via their own
  # installs, resolved onto CLAUDE_CODE_EXECUTABLE / CODEX_PATH (adapters.ts binaryEnv),
  # so strip the multi-hundred-MB bundled platform binaries the SDKs pull in.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**" # bundled claude-code binary (~225M)
  - "!node_modules/@openai/codex-*/**"                  # bundled codex binary (~242M)
asarUnpack:
  # Adapters are spawned as Node scripts (ELECTRON_RUN_AS_NODE), so their whole runtime
  # closure must be real on-disk files, not inside app.asar. That closure is exactly
  # these two scopes: both adapters + @agentclientprotocol/sdk + @anthropic-ai/
  # claude-agent-sdk, each with zero further runtime deps.
  - "**/node_modules/@agentclientprotocol/**"
  - "**/node_modules/@anthropic-ai/**"
mac:
  target:
    - target: dir
      arch: arm64
    - target: zip
      arch: arm64
    - target: dmg
      arch: arm64
  identity: "-"
  hardenedRuntime: false
  category: public.app-category.developer-tools
npmRebuild: false
